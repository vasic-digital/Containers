# HelixTrack Core Stack
# Multi-service stack for running HelixTrack Core within the containers submodule.
# Supports multi-space data isolation via --space-root flag.
#
# §11.4.28 EXCEPTION (operator-approved 2026-06-22, documented per §11.4.112): this
# compose file + its ../helix_track/ build-context refs are HelixTrack-specific and
# would normally NOT live in the project-agnostic containers submodule. The operator
# explicitly authorized keeping it here as a sanctioned reference stack for the
# HelixTrack-class deployment. Consuming projects that do not run HelixTrack ignore it.
#
# Usage:
#   cd containers && docker compose -f compose.helixtrack.yml up -d
#   OR via containers pkg/boot: boot --compose ./containers/compose.helixtrack.yml

services:
  # ============================================
  # HELIXTRACK CORE (Go Backend)
  # ============================================
  helixtrack-core:
    build:
      context: ../helix_track/core/Application
      dockerfile: Dockerfile
    container_name: helixtrack-core
    environment:
      HT_CONFIG: /config/default.json
      HT_SPACE_ROOT: /data/spaces/_default
      HT_DB_TYPE: sqlite
    ports:
      - "8080:8080"
    volumes:
      # Space data (per-project isolated databases + assets)
      - ../helix_track/spaces:/data/spaces
      # Core configuration
      - ../helix_track/core/Application/Configurations:/config
    healthcheck:
      # /health is the app's real liveness route; root `/` returns 404 (no route),
      # which made `podman ps` mislabel the healthy container "unhealthy" (real
      # deploy 2026-06-22, docs/qa/20260622-213843-distribute-thinker-green/).
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - helixtrack-net
    restart: unless-stopped
    command: ["./htCore", "--space-root=/data/spaces/_default"]

  # ============================================
  # POSTGRESQL (optional, production target)
  # ============================================
  helixtrack-postgres:
    image: postgres:16-alpine
    container_name: helixtrack-postgres
    environment:
      POSTGRES_DB: helixtrack
      POSTGRES_USER: helixtrack
      POSTGRES_PASSWORD: ${HT_PG_PASSWORD:-helixtrack_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helixtrack -d helixtrack"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - helixtrack-net
    volumes:
      - helixtrack-pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - production

networks:
  helixtrack-net:
    name: helixtrack-network
    driver: bridge

volumes:
  helixtrack-pg-data:
